project:
  type: website
  output-dir: _site
  # Each class's PDF is kept beside its source page and copied into the
  # render on every build, so a later class's publish cannot drop it.
  resources:
    - "class*/index.pdf"

website:
  title: "ISA 401 Notes"
  favicon: favicon.png
  search: false
  navbar:
    right:
      - text: "Slides and schedule"
        href: https://github.com/fmegahed/isa401#schedule

format:
  html:
    theme: [cosmo, site.scss]
    toc: true
    toc-depth: 3
    code-copy: true
